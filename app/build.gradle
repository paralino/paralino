plugins {
    id 'com.android.application'
    id 'kotlin-android'
    id 'kotlin-parcelize'
    id 'kotlin-kapt'
    id 'kotlinx-serialization'
    id 'androidx.navigation.safeargs.kotlin'
}

android {
    compileSdkVersion 30
    buildToolsVersion "30.0.3"

    variantFilter { variant ->
        if(variant.buildType.name == 'release' && variant.getFlavors().get(0).name == 'internal') {
            variant.setIgnore(true)
        }
        if(variant.buildType.name == 'debug' && variant.getFlavors().get(0).name == 'playStore') {
            variant.setIgnore(true)
        }
        if(variant.buildType.name == 'debug' && variant.getFlavors().get(0).name == 'playStoreTest') {
            variant.setIgnore(true)
        }
    }

    defaultConfig {
        applicationId "com.zbapp.locationtrack"
        minSdkVersion 26
        targetSdkVersion 30
        versionCode 1
        versionName "1.0"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"

        def propsFile = rootProject.file('user.properties')
        if (propsFile.exists()) {
            def props = new Properties()
            props.load(new FileInputStream(propsFile))
            buildConfigField("String", "serverUrl", props['serverUrl'])
            buildConfigField("String", "openServerUrl", props['openServerUrl'])
        }

        // room schema export
        javaCompileOptions {
            annotationProcessorOptions {
                arguments = ["room.schemaLocation": "$projectDir/schemas".toString()]
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            debuggable false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
        debug {
            debuggable true
        }
    }

    flavorDimensions "default"
    productFlavors {
        playStoreTest {
            dimension "default"
            versionCode 1
            versionName "1.0.0"

            buildConfigField("boolean", "internalTesting", "true")
            buildConfigField("boolean", "forceLogToSystem", "false")
        }
        playStore {
            dimension "default"
            versionCode 1
            versionName "1.0.0"

            buildConfigField("boolean", "internalTesting", "false")
            buildConfigField("boolean", "forceLogToSystem", "false")
        }
        internal {
            dimension "default"
            versionCode 1

            versionName "0.0.1"
            buildConfigField("boolean", "internalTesting", "true")
            buildConfigField("boolean", "forceLogToSystem", "true")
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
    kotlinOptions {
        jvmTarget = '1.8'
    }
    buildFeatures {
        viewBinding true
    }

}

dependencies {


    implementation project(path: ':core')
    implementation project(path: ':remote')
    testImplementation 'junit:junit:4.+'
    androidTestImplementation 'androidx.test.ext:junit:1.1.2'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.3.0'


    // region android and kotlin
    implementation "org.jetbrains.kotlin:kotlin-stdlib:$kotlin_version"
    implementation 'com.google.android.material:material:1.3.0'
    implementation 'androidx.appcompat:appcompat:1.2.0'
    implementation 'androidx.core:core-ktx:1.3.2'
    implementation 'androidx.constraintlayout:constraintlayout:2.0.4'
    implementation "androidx.preference:preference-ktx:1.1.1"
    implementation "androidx.security:security-crypto-ktx:1.1.0-alpha02"
    implementation "androidx.legacy:legacy-support-core-utils:1.0.0"

    implementation "androidx.recyclerview:recyclerview:1.2.0-rc01"

    implementation "androidx.lifecycle:lifecycle-common-java8:2.3.1"
    implementation "androidx.lifecycle:lifecycle-extensions:2.2.0"
    implementation "androidx.lifecycle:lifecycle-viewmodel-ktx:2.3.1"
    implementation "androidx.lifecycle:lifecycle-runtime-ktx:2.3.1"
    implementation "androidx.lifecycle:lifecycle-livedata-ktx:2.3.1"

    implementation "androidx.navigation:navigation-fragment-ktx:2.3.4"
    implementation "androidx.navigation:navigation-ui-ktx:2.3.4"
    implementation "androidx.fragment:fragment-ktx:1.3.2"

    implementation "org.jetbrains.kotlinx:kotlinx-coroutines-core:1.4.1"
    implementation "org.jetbrains.kotlinx:kotlinx-coroutines-android:1.4.1"
    implementation "org.jetbrains.kotlinx:kotlinx-serialization-json:1.1.0"

    kapt 'androidx.room:room-compiler:2.2.6'
    implementation 'androidx.room:room-runtime:2.2.6'
    implementation "androidx.room:room-ktx:2.2.6"

    implementation 'org.koin:koin-android:2.2.2'
    implementation 'org.koin:koin-androidx-scope:2.2.2'
    implementation 'org.koin:koin-androidx-viewmodel:2.2.2'
    // endregion

    // region utils
    implementation 'com.google.android.gms:play-services-location:18.0.0'
    implementation 'org.osmdroid:osmdroid-android:6.1.10'
    // endregion

    // region 3rd party views
//    implementation 'com.facebook.shimmer:shimmer:0.5.0'
//    implementation 'com.google.android:flexbox:2.0.1'
    implementation "androidx.viewpager2:viewpager2:1.0.0"

    // endregion


}