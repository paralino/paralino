plugins {
    id 'com.android.application'
    id 'kotlin-android'
    id 'kotlin-parcelize'
    id 'kotlin-kapt'
    id 'kotlinx-serialization'
}

android {
    compileSdkVersion 33

    variantFilter { variant ->

        def names = variant.flavors*.name
        if (names.contains("playStore") && names.contains("oss")) {
            setIgnore(true)
        }
        if (names.contains("direct") && names.contains("google")) {
            setIgnore(true)
        }
        if(variant.buildType.name == 'debug' && names.contains("playStore")) {
            variant.setIgnore(true)
        }
        if(variant.buildType.name == 'debug' && names.contains("direct")) {
            variant.setIgnore(true)
        }
        if(variant.buildType.name == 'release' && variant.getFlavors().get(0).name == 'dev') {
            variant.setIgnore(true)
        }
    }

    defaultConfig {
        applicationId "app.paralino.android"
        minSdkVersion 26
        targetSdkVersion 33
        versionCode 1
        versionName "1.0"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"

        def propsFile = rootProject.file('user.properties')
        if (propsFile.exists()) {
            def props = new Properties()
            props.load(new FileInputStream(propsFile))
            buildConfigField("String", "serverUrl", props['serverUrl'])
            buildConfigField("String", "serverKey", props['serverKey'])
            buildConfigField("String", "mapboxAccessToken", props['MAPBOX_ACCESS_TOKEN'])
        }

        // room schema export
        javaCompileOptions {
            annotationProcessorOptions {
                arguments = ["room.schemaLocation": "$projectDir/schemas".toString()]
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            debuggable false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            buildConfigField("boolean", "internalTesting", "false")
            buildConfigField("boolean", "forceLogToSystem", "false")
        }
        debug {
            debuggable true
            buildConfigField("boolean", "internalTesting", "true")
            buildConfigField("boolean", "forceLogToSystem", "true")
        }
    }

    flavorDimensions "version", "source"
    productFlavors {
        playStore {
            dimension "version"
            versionCode 1
            versionName "1.0.0"
        }
        direct {
            dimension "version"
            versionCode 1
            versionName "0.0.1"
        }
        dev {
            dimension "version"
            versionCode 1
            versionName "0.0.1"
            versionNameSuffix "-dev"
            applicationIdSuffix ".dev"
        }
        oss {
            dimension "source"
        }
        google {
            dimension "source"
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
    kotlinOptions {
        jvmTarget = '1.8'
    }
    buildFeatures {
        viewBinding true
        compose true
    }
    composeOptions {
        kotlinCompilerExtensionVersion '1.3.0'
    }

}

tasks.withType(org.jetbrains.kotlin.gradle.tasks.KotlinCompile).configureEach {
    kotlinOptions {
        freeCompilerArgs += "-opt-in=kotlin.RequiresOptIn"
    }
}

repositories {
    maven {
        url 'https://api.mapbox.com/downloads/v2/releases/maven'
        authentication {
            basic(BasicAuthentication)
        }
        def props = new Properties()
        props.load(new FileInputStream(rootProject.file('user.properties')))
        credentials {
            username = "mapbox"
            password = props['MAPBOX_SECRET_TOKEN']
        }
    }
}

dependencies {


    implementation project(path: ':shared')
    testImplementation 'junit:junit:4.+'
    androidTestImplementation 'androidx.test.ext:junit:1.1.2'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.3.0'


    // region android and kotlin
    implementation "org.jetbrains.kotlin:kotlin-stdlib:$kotlin_version"
    implementation 'com.google.android.material:material:1.6.1'
    implementation 'androidx.appcompat:appcompat:1.5.0'
    implementation 'androidx.core:core-ktx:1.8.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    implementation "androidx.preference:preference-ktx:1.2.0"
    implementation "androidx.security:security-crypto-ktx:1.1.0-alpha03"
    implementation "androidx.legacy:legacy-support-core-utils:1.0.0"

    implementation "androidx.recyclerview:recyclerview:1.2.1"

    implementation "androidx.lifecycle:lifecycle-common-java8:2.5.1"
    implementation "androidx.lifecycle:lifecycle-extensions:2.2.0"
    implementation "androidx.lifecycle:lifecycle-viewmodel-ktx:2.5.1"
    implementation "androidx.lifecycle:lifecycle-runtime-ktx:2.5.1"
    implementation "androidx.lifecycle:lifecycle-livedata-ktx:2.5.1"

    // region compose
    def composeVersion = '1.3.0-beta01'
    implementation 'androidx.activity:activity-compose:1.5.1'
    implementation 'androidx.lifecycle:lifecycle-viewmodel-compose:2.5.1'
    implementation "androidx.constraintlayout:constraintlayout-compose:1.0.1"
    implementation "androidx.compose.animation:animation:$composeVersion"
    implementation "androidx.compose.material:material:$composeVersion"
    implementation "androidx.compose.material:material-icons-core:$composeVersion"
    implementation "androidx.compose.material:material-icons-extended:$composeVersion"
    implementation "androidx.compose.foundation:foundation:$composeVersion"
    implementation "androidx.compose.runtime:runtime:$composeVersion"
    implementation "androidx.compose.ui:ui:$composeVersion"
    debugImplementation "androidx.compose.ui:ui-tooling:$composeVersion"
    implementation "androidx.navigation:navigation-compose:2.5.1"
    implementation "com.google.accompanist:accompanist-pager:0.26.2-beta"
    implementation "com.google.accompanist:accompanist-permissions:0.26.2-beta"

//    implementation "androidx.compose.material3:material3:1.0.0-alpha10"
//    implementation "androidx.compose.foundation:foundation-layout:$composeVersion"
//    implementation "androidx.compose.runtime:runtime-livedata:$composeVersion"
//    implementation "androidx.compose.ui:ui-tooling-preview:$composeVersion"

    // endregion

    implementation "org.jetbrains.kotlinx:kotlinx-coroutines-core:1.6.4"
    implementation "org.jetbrains.kotlinx:kotlinx-coroutines-android:1.6.4"
    implementation "org.jetbrains.kotlinx:kotlinx-serialization-json:1.3.1"
    implementation "org.jetbrains.kotlinx:kotlinx-datetime:0.3.2"

    kapt 'androidx.room:room-compiler:2.4.3'
    implementation 'androidx.room:room-runtime:2.4.3'
    implementation "androidx.room:room-ktx:2.4.3"

    def koinVersion = '3.1.6'
    implementation "io.insert-koin:koin-android:$koinVersion"
    implementation "io.insert-koin:koin-androidx-compose:$koinVersion"
    // endregion

    // region utils
    // TODO Replace to googleImplementation when LocationManager API is implemented
//    googleImplementation 'com.google.android.gms:play-services-location:19.0.1'
    implementation 'com.google.android.gms:play-services-location:19.0.1'
    ossImplementation 'org.osmdroid:osmdroid-android:6.1.10'
    googleImplementation 'com.mapbox.maps:android:10.4.0'
    googleImplementation "com.mapbox.mapboxsdk:mapbox-sdk-turf:6.4.0"

    implementation 'com.cossacklabs.com:themis:0.14.0'

    // TODO replace with vanilla library at some point
    implementation project(path: ':appwrite')
    implementation(platform("com.squareup.okhttp3:okhttp-bom:4.9.0"))
    implementation("com.squareup.okhttp3:okhttp")
    implementation("com.squareup.okhttp3:logging-interceptor")
    // endregion

    // region 3rd party views
//    implementation 'com.facebook.shimmer:shimmer:0.5.0'
//    implementation 'com.google.android:flexbox:2.0.1'

    // endregion
}