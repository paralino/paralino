plugins {
    id 'com.android.application'
    id 'kotlin-android'
    id 'kotlin-parcelize'
    id 'kotlin-kapt'
    id 'kotlinx-serialization'
    id 'com.mikepenz.aboutlibraries.plugin'
}

android {
    namespace 'app.paralino.android'
    compileSdkVersion 33

    variantFilter { variant ->
        def names = variant.flavors*.name
        def variantIgnore = (variant.buildType.name == 'debug' && names.contains("playStore")) ||
                (variant.buildType.name == 'debug' && names.contains("playStoreTest")) ||
                (variant.buildType.name == 'debug' && names.contains("direct")) ||
                (names.contains("direct") && names.contains("google")) ||
                (names.contains("playStore") && names.contains("oss")) ||
                (names.contains("playStoreTest") && names.contains("oss"))
        variant.setIgnore(variantIgnore)
    }

    defaultConfig {
        applicationId "app.paralino.android"
        minSdkVersion 29
        targetSdkVersion 33
        versionCode 1
        versionName "1.0"


        buildConfigField("boolean", "internalTesting", "false")
        buildConfigField("boolean", "forceLogToSystem", "false")

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"

        def propsFile = rootProject.file('user.properties')
        if (propsFile.exists()) {
            def props = new Properties()
            props.load(new FileInputStream(propsFile))
            buildConfigField("String", "serverUrl", props['serverUrl'])
            buildConfigField("String", "serverKey", props['serverKey'])
            buildConfigField("String", "mapboxAccessToken", props['MAPBOX_ACCESS_TOKEN'])
            resValue "string", "glitchTipDSN", props['glitchTipDSN']
        }

        // room schema export
        javaCompileOptions {
            annotationProcessorOptions {
                arguments = ["room.schemaLocation": "$projectDir/schemas".toString()]
            }
        }
    }

    signingConfigs {
        testConfig {
            try {
                def propsFile = rootProject.file('user.properties')
                def props = new Properties()
                props.load(new FileInputStream(propsFile))
                storePassword props['testKeyPassword']
                keyAlias props['testKeyAlias']
                keyPassword props['testKeyPassword']
                storeFile file("$projectDir.parentFile/paralinoTestKey")
            }
            catch (ex) {
                throw ex
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            debuggable false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
        debug {
            debuggable true
        }
    }

    flavorDimensions "version", "source"
    productFlavors {
        playStore {
            dimension "version"
            versionCode 1
            versionName "1.0.0"
        }
        playStoreTest {
            dimension "version"
            versionCode 1
            versionName "0.1.0"
        }
        direct {
            dimension "version"
            versionCode 1
            versionName "0.0.1"
        }
        dev {
            dimension "version"
            versionCode 1
            versionName "0.0.1"
            versionNameSuffix "-dev"
            applicationIdSuffix ".dev"

            buildConfigField("boolean", "internalTesting", "true")
            buildConfigField("boolean", "forceLogToSystem", "true")
            signingConfig signingConfigs.testConfig
        }
        oss {
            dimension "source"
        }
        google {
            dimension "source"
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
    kotlinOptions {
        jvmTarget = '1.8'
    }
    buildFeatures {
        viewBinding true
        compose true
    }
    composeOptions {
        kotlinCompilerExtensionVersion '1.3.2'
    }
    packagingOptions {
        resources {
            excludes += "/META-INF/{AL2.0,LGPL2.1}"
            // from coroutines
            excludes += "DebugProbesKt.bin"
        }
    }
}

aboutLibraries {
    configPath = "config"
}

tasks.withType(org.jetbrains.kotlin.gradle.tasks.KotlinCompile).configureEach {
    kotlinOptions {
        freeCompilerArgs += "-opt-in=kotlin.RequiresOptIn"
    }
}

repositories {
    maven {
        url 'https://api.mapbox.com/downloads/v2/releases/maven'
        authentication {
            basic(BasicAuthentication)
        }
        def props = new Properties()
        props.load(new FileInputStream(rootProject.file('user.properties')))
        credentials {
            username = "mapbox"
            password = props['MAPBOX_SECRET_TOKEN']
        }
    }
}

dependencies {


    implementation project(path: ':shared')
    testImplementation 'junit:junit:4.+'
    androidTestImplementation 'androidx.test.ext:junit:1.1.2'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.3.0'


    // region android and kotlin
    implementation "org.jetbrains.kotlin:kotlin-stdlib:1.7.20"
    implementation 'com.google.android.material:material:1.7.0'
    implementation 'androidx.appcompat:appcompat:1.5.1'
    implementation 'androidx.core:core-ktx:1.9.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    implementation "androidx.preference:preference-ktx:1.2.0"
    implementation "androidx.security:security-crypto-ktx:1.1.0-alpha04"
    implementation "androidx.legacy:legacy-support-core-utils:1.0.0"

    implementation "androidx.work:work-runtime-ktx:2.7.1"

    implementation "androidx.lifecycle:lifecycle-common-java8:2.5.1"
    implementation "androidx.lifecycle:lifecycle-extensions:2.2.0"
    implementation "androidx.lifecycle:lifecycle-runtime-ktx:2.5.1"
    implementation "androidx.lifecycle:lifecycle-livedata-ktx:2.5.1"

    implementation "org.jetbrains.kotlinx:kotlinx-coroutines-android:1.6.4"
    // endregion

    // region compose
    implementation 'androidx.activity:activity-compose:1.6.1'
    implementation 'androidx.lifecycle:lifecycle-viewmodel-compose:2.5.1'
    implementation "androidx.constraintlayout:constraintlayout-compose:1.0.1"
    implementation "androidx.navigation:navigation-compose:2.5.3"

    implementation platform('androidx.compose:compose-bom:2022.12.00')
    implementation "androidx.compose.animation:animation"
    implementation "androidx.compose.material:material:"
    implementation "androidx.compose.material:material-icons-core"
    implementation "androidx.compose.material:material-icons-extended"
    implementation "androidx.compose.foundation:foundation"
    implementation "androidx.compose.runtime:runtime"
    implementation "androidx.compose.ui:ui"
    debugImplementation "androidx.compose.ui:ui-tooling"
    implementation "androidx.compose.ui:ui-tooling-preview"

    implementation "com.google.accompanist:accompanist-pager:0.28.0"
    implementation "com.google.accompanist:accompanist-permissions:0.28.0"

//    implementation "androidx.compose.material3:material3:1.0.0-alpha10"
//    implementation "androidx.compose.foundation:foundation-layout:$composeVersion"
//    implementation "androidx.compose.runtime:runtime-livedata:$composeVersion"
//    implementation "androidx.compose.ui:ui-tooling-preview:$composeVersion"

    // endregion

    // region di
    kapt 'androidx.room:room-compiler:2.4.3'
    implementation 'androidx.room:room-runtime:2.4.3'
    implementation "androidx.room:room-ktx:2.4.3"

    implementation "androidx.datastore:datastore-preferences:1.0.0"

    def koinVersion = '3.1.6'
    implementation "io.insert-koin:koin-android:$koinVersion"
    implementation "io.insert-koin:koin-androidx-compose:$koinVersion"
    // endregion

    // region utils
    // TODO Replace to googleImplementation when LocationManager API is implemented
//    googleImplementation 'com.google.android.gms:play-services-location:19.0.1'
    implementation 'com.google.android.gms:play-services-location:21.0.1'
    ossImplementation 'org.osmdroid:osmdroid-android:6.1.10'
    googleImplementation 'com.mapbox.maps:android:10.8.0'
    googleImplementation "com.mapbox.mapboxsdk:mapbox-sdk-turf:6.4.0"

    googleImplementation ("com.google.firebase:firebase-messaging-ktx:23.1.1") {
        exclude group: 'com.google.firebase', module: 'firebase-core'
        exclude group: 'com.google.firebase', module: 'firebase-analytics'
        exclude group: 'com.google.firebase', module: 'firebase-measurement-connector'
    }

    implementation 'com.cossacklabs.com:themis:0.14.0'

    implementation "com.mikepenz:aboutlibraries-compose:10.5.1"
    implementation 'io.sentry:sentry-android:6.9.1'

    // TODO replace with vanilla library at some point
    releaseImplementation("io.appwrite:sdk-for-android:1.1.0")
    debugImplementation project(path: ':appwrite')
    debugImplementation(platform("com.squareup.okhttp3:okhttp-bom:4.9.0"))
    debugImplementation("com.squareup.okhttp3:okhttp")
    debugImplementation("com.squareup.okhttp3:logging-interceptor")
    // endregion

}