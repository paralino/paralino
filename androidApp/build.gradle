plugins {
    id 'com.android.application'
    id 'kotlin-android'
    id 'kotlin-parcelize'
    id 'kotlin-kapt'
    id 'kotlinx-serialization'
    id 'org.jetbrains.kotlin.plugin.compose'
    id 'com.mikepenz.aboutlibraries.plugin'
}

android {
    namespace 'app.paralino.android'
    compileSdkVersion 34

    variantFilter { variant ->
        def names = variant.flavors*.name
        def variantIgnore = (variant.buildType.name == 'debug' && names.contains("playStore")) ||
                (variant.buildType.name == 'debug' && names.contains("playStoreTest")) ||
                (variant.buildType.name == 'debug' && names.contains("direct")) ||
                (variant.buildType.name == 'release' && names.contains("dev")) ||
                (names.contains("playStore") && names.contains("oss"))
        variant.setIgnore(variantIgnore)
    }

    applicationVariants.all { variant ->
        variant.outputs.all { output ->
            def name = "Paralino"
            def SEP = "_"
            def flavor = variant.productFlavors[0].name.take(3)
            def buildType = variant.buildType.name.take(1).toUpperCase()
            def versionName = variant.versionName
            def newApkName = name + SEP + "v" + versionName + buildType + ".apk"
            output.outputFileName = newApkName
        }
    }

    defaultConfig {
        applicationId "app.paralino.android"
        minSdkVersion 29
        targetSdkVersion 34
        versionCode 1
        versionName "1.0"

        setProperty("archivesBaseName", "Paralino" + "_v" + versionName + "($versionCode)")

        buildConfigField("boolean", "internalTesting", "false")
        buildConfigField("boolean", "forceLogToSystem", "false")

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"

        def propsFile = rootProject.file('user.properties')
        if (propsFile.exists()) {
            def props = new Properties()
            props.load(new FileInputStream(propsFile))
            manifestPlaceholders = [MAPS_API_KEY: props['MAPS_API_KEY']]
            resValue "string", "glitchTipDSN", props['glitchTipDSNAndroid']
        }

        // room schema export
        javaCompileOptions {
            annotationProcessorOptions {
                arguments = ["room.schemaLocation": "$projectDir/schemas".toString()]
            }
        }
    }

    signingConfigs {
        testConfig {
            try {
                def propsFile = rootProject.file('user.properties')
                def props = new Properties()
                props.load(new FileInputStream(propsFile))
                storePassword props['testKeyPassword']
                keyAlias props['testKeyAlias']
                keyPassword props['testKeyPassword']
                storeFile file("$projectDir.parentFile/paralinoTestKey")
            }
            catch (ex) {
                throw ex
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            debuggable false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
        debug {
            debuggable true
            versionNameSuffix "D"
            signingConfig signingConfigs.testConfig
        }
    }

    flavorDimensions "version", "source"
    productFlavors {
        playStore {
            dimension "version"
            versionCode 14
            versionName "0.5.1"
        }
        direct {
            dimension "version"
            versionCode 20
            versionName "0.8.3"
            versionNameSuffix "-int"
            applicationIdSuffix ".int"
            buildConfigField("boolean", "forceLogToSystem", "false")
            signingConfig signingConfigs.testConfig
        }
        dev {
            dimension "version"
            versionCode 21
            versionName "0.8.4"
            versionNameSuffix "-dev"
            applicationIdSuffix ".dev"

            buildConfigField("boolean", "internalTesting", "true")
            buildConfigField("boolean", "forceLogToSystem", "true")
            signingConfig signingConfigs.testConfig
        }
        oss {
            dimension "source"
        }
        google {
            dimension "source"
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = '17'
    }

    buildFeatures {
        viewBinding true
        compose true
        buildConfig true
    }
    packagingOptions {
        resources {
            excludes += "/META-INF/{AL2.0,LGPL2.1}"
            // from coroutines
            excludes += "DebugProbesKt.bin"
        }
    }
}

aboutLibraries {
    configPath = "config"
}

tasks.withType(org.jetbrains.kotlin.gradle.tasks.KotlinCompile).configureEach {
    kotlinOptions {
        freeCompilerArgs += "-opt-in=kotlin.RequiresOptIn"
    }
}

repositories {
    maven {
        url 'https://api.mapbox.com/downloads/v2/releases/maven'
        authentication {
            basic(BasicAuthentication)
        }
        def props = new Properties()
        props.load(new FileInputStream(rootProject.file('user.properties')))
        credentials {
            username = "mapbox"
            password = props['MAPBOX_SECRET_TOKEN']
        }
    }
}

